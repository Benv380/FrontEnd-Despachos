version: '3.8'

services:

  mysql-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_USER: ${DB_USERNAME:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  back-ventas:
    build: ../back-Ventas_SpringBoot/Springboot-API-REST
    restart: unless-stopped
    environment:
      DB_ENDPOINT: mysql-db
      DB_PORT: 3306
      DB_NAME: ventas_db
      DB_USERNAME: ${DB_USERNAME:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-root123}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - app-network

  back-despachos:
    build: ../back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    restart: unless-stopped
    environment:
      DB_ENDPOINT: mysql-db
      DB_PORT: 3306
      DB_NAME: despachos_db
      DB_USERNAME: ${DB_USERNAME:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-root123}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - app-network

  front-despacho:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      BACK_DESPACHOS_HOST: back-despachos:8081
      BACK_VENTAS_HOST: back-ventas:8080
      NGINX_RESOLVER: 127.0.0.11
    depends_on:
      - back-ventas
      - back-despachos
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    name: despacho_mysql_data
